<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#032b49">
  
  <title>سامانه پاداش‌ها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

    :root {
      --header-bg: #002b49;
      --page-bg: #edf2f7;
      --card-bg: #ffffff;
      --tax-bg: #dbe7fb;
      --tax-text: #3c7bf6;
      --pill-blue: #3897f8;
      --pill-text: #ffffff;
      --text-main: #1f2a37;
      --text-sub: #8692a4;
      --text-date: #515d6e;
      --border-line: #f1f3f7;
      --arrow-color: #9aa5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
    }

    body {
      background-color: var(--page-bg);
      color: var(--text-main);
      direction: rtl;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
    }

    /* ۱. هدر سرمه‌ای ساده و تمیز با دکمه منو در سمت چپ */
    .top-header {
      background-color: var(--header-bg);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: flex-start; /* با توجه به RTL بودن، ابتدای خط می‌شود سمت چپ اگر flex-direction معکوس باشد یا از margin-left:auto استفاده شود */
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* قرارگیری دکمه منوی همبرگری در سمت چپ واقعی هدر */
    .header-menu-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px 6px;
      margin-right: auto; /* انتقال به منتهی‌الیه سمت چپ در صفحه RTL */
    }

    .header-menu-btn span {
      display: block;
      width: 22px;
      height: 2.2px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* محتوای بدنه */
    .main-content {
      padding: 14px 14px 40px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ۲. کادر لینک احکام مالیاتی کل کشور */
    .tax-alert-box {
      background-color: var(--tax-bg);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--tax-text);
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .tax-alert-box:active {
      opacity: 0.8;
    }

    .tax-alert-box svg {
      width: 17px;
      height: 17px;
      stroke: var(--tax-text);
      stroke-width: 2.2;
      fill: none;
      transform: rotate(-45deg);
    }

    /* ۳. کارت سفید اصلی */
    .rewards-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 22px 16px 12px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
    }

    .card-header-area {
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      color: #1a2332;
      margin-bottom: 5px;
    }

    .total-commission-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-sub);
      font-weight: 400;
    }

    /* عدد مجموع کل بدون بولد (Normal / Regular) */
    .total-amount-val {
      font-size: 15.5px;
      font-weight: 400; /* کاملا معمولی و بدون بولد */
      color: #1e293b;
      letter-spacing: 0.3px;
    }

    .currency-label {
      font-size: 12.5px;
      color: var(--text-sub);
      font-weight: 400;
    }

    /* جدول سرفصل دوره‌ها */
    .table-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border-line);
      color: var(--text-sub);
      font-size: 13.5px;
      font-weight: 400;
      padding-left: 2px;
      padding-right: 2px;
    }

    /* ردیف‌های لیست پاداش */
    .reward-item {
      border-bottom: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
    }

    .reward-item:last-child {
      border-bottom: none;
    }

    .reward-row-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 2px;
      cursor: pointer;
      user-select: none;
    }

    .right-side-date {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-label {
      font-size: 13.5px;
      color: var(--text-date);
      font-weight: 400;
    }

    .arrow-icon {
      display: flex;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .arrow-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--arrow-color);
      stroke-width: 2.2;
      fill: none;
    }

    .reward-item.expanded .arrow-icon {
      transform: rotate(90deg);
    }

    /* کپسول آبی پاداش با فونت کاملاً ساده و غیر بولد (Regular) */
    .amount-badge {
      background-color: var(--pill-blue);
      color: var(--pill-text);
      padding: 6.5px 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 400; /* کاملا معمولی و بدون بولد */
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.2px;
    }

    .badge-curr {
      font-size: 11.5px;
      font-weight: 300;
      opacity: 0.95;
    }

    /* جزئیات دوره در صورت کلیک */
    .reward-detail-panel {
      display: none;
      background-color: #f8fafc;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.8;
      border: 1px dashed #cbd5e1;
    }

    .reward-item.expanded .reward-detail-panel {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* دکمه شناور تنظیمات برای باز کردن پنل مدیریت */
    .floating-gear-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--header-bg);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
    }

    .floating-gear-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    /* پنل مدیریت مدال */
    .admin-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 20, 35, 0.6);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .admin-modal-overlay.open {
      display: flex;
    }

    .admin-drawer {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .close-btn {
      background: #f3f4f6;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      color: #374151;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
    }

    .admin-btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 12.5px;
    }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-save { background: #10b981; color: #fff; width: 100%; padding: 12px; font-size: 14px; }

    /* لیست آیتم‌ها در پنل مدیریت با قابلیت ویرایش مستقیم */
    .items-table-scroll {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fafafa;
    }

    .admin-row-editor {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .admin-row-editor-top {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .admin-row-editor-top input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
    }

    .delete-item-btn {
      background: #fee2e2;
      border: none;
      color: #dc2626;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11.5px;
      cursor: pointer;
    }

    /* پیام اعلان وضعیت */
    .toast-msg {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 2000;
      display: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- ۱. هدر سرمه‌ای ساده با دکمه منو در سمت چپ بدون لوگو -->
    <header class="top-header">
      <button class="header-menu-btn" onclick="toggleAdmin(true)" aria-label="منو و تنظیمات">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main class="main-content">

      <!-- ۲. کادر آبی لینک احکام مالیاتی کل کشور -->
      <a href="https://inta.tax.gov.ir/Pages/Action/LawsDocShow/5/1/1/1000/6263" target="_blank" rel="noopener noreferrer" class="tax-alert-box">
        <span>لینک احکام مالیاتی کل کشور</span>
        <svg viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </a>

      <!-- ۳. کارت سفید پاداش‌ها -->
      <section class="rewards-card">
        
        <div class="card-header-area">
          <h1 class="card-title">پاداش ها</h1>
          <div class="total-commission-row">
            <span>جمع کل پورسانت ها</span>
            <span class="total-amount-val" id="totalAmountDisplay">15,220,689,008</span>
            <span class="currency-label">ریال</span>
          </div>
        </div>

        <div class="table-head">
          <span>دوره</span>
          <span>جمع پاداش</span>
        </div>

        <div id="rewardsListContainer">
          <!-- ردیف‌های دوره‌ها -->
        </div>

      </section>
    </main>

    <!-- دکمه شناور تنظیمات برای دسترسی سریع -->
    <button class="floating-gear-btn" onclick="toggleAdmin(true)" title="مدیریت پاداش‌ها">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>

    <!-- ۴. پنل مدیریت اطلاعات و ویرایش مبالغ هر هفته -->
    <div class="admin-modal-overlay" id="adminModal" onclick="handleOverlayClick(event)">
      <div class="admin-drawer">
        <div class="drawer-header">
          <span class="drawer-title">پنل مدیریت پورسانت‌ها و دوره‌ها</span>
          <button class="close-btn" onclick="toggleAdmin(false)">✕</button>
        </div>

        <!-- فیلد مستقل مجموع کل -->
        <div class="form-group">
          <label>مجموع کل پورسانت‌ها (فیلد کاملاً مستقل - ریال):</label>
          <input type="number" id="inputTotalCommission" class="form-control" placeholder="15220689008">
          <small style="color: #6b7280; font-size: 11px;">تغییر این مبلغ اثری روی مقادیر هفتگی ندارد.</small>
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb;">

        <!-- ویرایش مستقیم پورسانت هر هفته -->
        <div class="form-group">
          <label>مدیریت و ویرایش مستقیم مبالغ هر هفته:</label>
          <div class="items-table-scroll" id="adminListScroll">
            <!-- ردیف‌های قابل ویرایش با JS ساخته می‌شوند -->
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb;">

        <!-- افزودن دوره جدید -->
        <div class="form-group">
          <label>افزودن دوره جدید:</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="newDateInput" class="form-control" placeholder="تاریخ دوره (مثلاً: ۲ آبان ۱۴۰۵)">
            <input type="number" id="newAmountInput" class="form-control" placeholder="مبلغ دوره (ریال)">
          </div>
          <button class="admin-btn btn-primary" onclick="addNewPeriod()">+ افزودن دوره به لیست</button>
        </div>

        <!-- پشتیبان‌گیری و بازیابی -->
        <div style="display: flex; gap: 8px;">
          <button class="admin-btn btn-secondary" style="flex:1" onclick="exportDataJSON()">پشتیبان JSON</button>
          <button class="admin-btn btn-secondary" style="flex:1" onclick="document.getElementById('importFileInput').click()">بازیابی JSON</button>
          <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importDataJSON(event)">
          <button class="admin-btn btn-danger" onclick="resetToInitialData()">بازنشانی به پیش‌فرض</button>
        </div>

        <!-- ذخیره نهایی -->
        <button class="admin-btn btn-save" onclick="saveAllChanges()">ذخیره همه تغییرات</button>
      </div>
    </div>

    <!-- پیام وضعیت -->
    <div class="toast-msg" id="toastMsg">تغییرات با موفقیت ذخیره شد</div>

  </div>

        { id: 19, date: "۲۳ خرداد ۱۴۰۵", amount: 32000000, details: "پورسانت دوره هفته چهارم خرداد ماه ۱۴۰۵" },
        { id: 20, date: "۹ خرداد ۱۴۰۵", amount: 32000000, details: "پورسانت دوره هفته دوم خرداد ماه ۱۴۰۵" },
        { id: 21, date: "۲ خرداد ۱۴۰۵", amount: 32000000, details: "پورسانت دوره هفته اول خرداد ماه ۱۴۰۵" },
        { id: 22, date: "۱ خرداد ۱۴۰۵", amount: 27349628, details: "تسویه آغاز خرداد ماه ۱۴۰۵" },
        { id: 23, date: "۱۹ اردیبهشت ۱۴۰۵", amount: 32000000, details: "پورسانت دوره هفته سوم اردیبهشت ماه ۱۴۰۵" },
        { id: 24, date: "۱۲ اردیبهشت ۱۴۰۵", amount: 19200000, details: "پورسانت دوره هفته دوم اردیبهشت ماه ۱۴۰۵" },
        { id: 25, date: "۱ اردیبهشت ۱۴۰۵", amount: 23946668, details: "تسویه آغاز اردیبهشت ماه ۱۴۰۵" },
        { id: 26, date: "۲۲ فروردین ۱۴۰۵", amount: 32000000, details: "پورسانت دوره هفته چهارم فروردین ماه ۱۴۰۵" },
        { id: 27, date: "۱ فروردین ۱۴۰۵", amount: 38489500, details: "تسویه آغاز سال ۱۴۰۵" }
      ]
    };

    let appState = loadAppData();

    function loadAppData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return JSON.parse(stored);
      } catch (e) {
        console.error("Error reading localStorage", e);
      }
      return JSON.parse(JSON.stringify(INITIAL_DATA));
    }

    function saveAppData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error("Error saving data", e);
      }
    }

    function formatNumber(num) {
      if (num === null || num === undefined) return "0";
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    /* رندر صفحه اصلی */
    function renderMainUI() {
      document.getElementById('totalAmountDisplay').textContent = formatNumber(appState.totalCommission);

      const container = document.getElementById('rewardsListContainer');
      container.innerHTML = '';

      appState.items.forEach((item) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'reward-item';
        itemEl.id = `item-row-${item.id}`;

        itemEl.innerHTML = `
          <div class="reward-row-main" onclick="toggleDetails(${item.id})">
            <!-- سمت راست: فلش خاکستری و تاریخ دوره -->
            <div class="right-side-date">
              <span class="arrow-icon">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </span>
              <span class="date-label">${item.date}</span>
            </div>

            <!-- سمت چپ: کپسول آبی پاداش با فونت کاملاً ساده و غیر بولد -->
            <div class="amount-badge">
              <span>${formatNumber(item.amount)}</span>
              <span class="badge-curr">ریال</span>
            </div>
          </div>

          <div class="reward-detail-panel">
            <strong>جزئیات دوره:</strong> ${item.details || 'توضیحات تکمیلی ثبت نشده است.'}<br>
            <strong>مبلغ ثبت‌شده:</strong> ${formatNumber(item.amount)} ریال
          </div>
        `;

        container.appendChild(itemEl);
      });
    }

    function toggleDetails(id) {
      const row = document.getElementById(`item-row-${id}`);
      if (row) {
        row.classList.toggle('expanded');
      }
    }

    /* پنل مدیریت */
    function toggleAdmin(show) {
      const modal = document.getElementById('adminModal');
      if (show) {
        document.getElementById('inputTotalCommission').value = appState.totalCommission;
        renderAdminList();
        modal.classList.add('open');
      } else {
        modal.classList.remove('open');
      }
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'adminModal') toggleAdmin(false);
    }

    /* رندر فیلدهای ویرایش مستقیم تاریخ و مبلغ هر هفته */
    function renderAdminList() {
      const listEl = document.getElementById('adminListScroll');
      listEl.innerHTML = '';

      appState.items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'admin-row-editor';
        div.innerHTML = `
          <div class="admin-row-editor-top">
            <input type="text" value="${item.date}" id="edit-date-${index}" title="تاریخ دوره" placeholder="تاریخ">
            <input type="number" value="${item.amount}" id="edit-amount-${index}" title="مبلغ دوره (ریال)" placeholder="مبلغ (ریال)">
            <button class="delete-item-btn" onclick="deletePeriod(${index})" title="حذف این دوره">حذف</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function addNewPeriod() {
      const dateVal = document.getElementById('newDateInput').value.trim();
      const amtVal = parseInt(document.getElementById('newAmountInput').value, 10);

      if (!dateVal || isNaN(amtVal)) {
        showToast('لطفاً تاریخ و مبلغ دوره را وارد کنید.');
        return;
      }

      appState.items.unshift({
        id: Date.now(),
        date: dateVal,
        amount: amtVal,
        details: `پورسانت مربوط به ${dateVal}`
      });

      document.getElementById('newDateInput').value = '';
      document.getElementById('newAmountInput').value = '';

      renderAdminList();
      showToast('دوره جدید اضافه شد');
    }

    function deletePeriod(index) {
      appState.items.splice(index, 1);
      renderAdminList();
    }

    /* ذخیره تمامی تغییرات مبالغ دوره‌ها و مجموع کل */
    function saveAllChanges() {
      // ۱. ذخیره مجموع کل مستقل
      const newTotal = parseInt(document.getElementById('inputTotalCommission').value, 10);
      if (!isNaN(newTotal)) {
        appState.totalCommission = newTotal;
      }

      // ۲. خواندن و اعمال مبالغ و تاریخ‌های ویرایش‌شده برای هر هفته
      appState.items.forEach((item, index) => {
        const dateInput = document.getElementById(`edit-date-${index}`);
        const amountInput = document.getElementById(`edit-amount-${index}`);

        if (dateInput && dateInput.value.trim() !== '') {
          item.date = dateInput.value.trim();
        }

        if (amountInput) {
          const val = parseInt(amountInput.value, 10);
          if (!isNaN(val)) {
            item.amount = val;
          }
        }
      });

      saveAppData();
      renderMainUI();
      toggleAdmin(false);
      showToast('تغییرات با موفقیت ذخیره شد');
    }

    function resetToInitialData() {
      appState = JSON.parse(JSON.stringify(INITIAL_DATA));
      saveAppData();
      renderMainUI();
      renderAdminList();
      document.getElementById('inputTotalCommission').value = appState.totalCommission;
      showToast('اطلاعات به حالت پیش‌فرض بازگردانده شد');
    }

    function exportDataJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `rewards_backup.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDataJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && parsed.items && typeof parsed.totalCommission !== 'undefined') {
            appState = parsed;
            saveAppData();
            renderMainUI();
            toggleAdmin(false);
            showToast('پشتیبان با موفقیت بازیابی شد');
          }
        } catch (err) {
          showToast('فایل JSON معتبر نیست');
        }
      };
      reader.readAsText(file);
    }

    renderMainUI();
  </script>
</body>
</html>
